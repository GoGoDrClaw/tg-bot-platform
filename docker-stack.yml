version: "3.9"

services:
  bot-manager:
    image: bot-platform/bot-manager:latest
    build:
      context: .
      dockerfile: packages/bot-manager/Dockerfile
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      DB_URL: ${DB_URL:-postgres://${DB_USER:-bot}:${DB_PASSWORD:-bot}@${DB_HOST:-postgres}:${DB_PORT:-5432}/${DB_NAME:-bot-platform}}
      API_PORT: ${API_PORT}
      API_HOST: ${API_HOST}
      WEBHOOK_BASE_URL: ${WEBHOOK_BASE_URL}
      LOG_LEVEL: ${LOG_LEVEL}
      TELEGRAM_API_BASE: ${TELEGRAM_API_BASE}
      RUNTIME_VERSION: ${RUNTIME_VERSION}
      BOT_API_FILES_VOLUME: ${BOT_API_FILES_VOLUME:-bot-platform_bot_api_files}
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
        mode: host
    networks:
      - botnet
    volumes:
      - pgdata:/var/lib/postgresql/data
      - storage:/app/storage
      - /var/run/docker.sock:/var/run/docker.sock

  postgres:
    image: postgres:15-alpine
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - botnet

  caddy:
    image: caddy:2-alpine
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
    networks:
      - botnet

  bot-api:
    image: docker.io/aiogram/telegram-bot-api:latest
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "true"
      TELEGRAM_VERBOSITY: 2
    ports:
      - target: 8081
        published: 8081
        protocol: tcp
        mode: host
    volumes:
      - bot_api_files:/var/lib/telegram-bot-api
    networks:
      - botnet

networks:
  botnet:
    driver: overlay

volumes:
  pgdata:
  bot_api_files:
  storage:
