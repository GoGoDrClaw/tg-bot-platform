version: "3.9"

services:
  bot-manager:
    build:
      context: .
      dockerfile: packages/bot-manager/Dockerfile
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      DB_URL: ${DB_URL:-postgres://${DB_USER:-bot}:${DB_PASSWORD:-bot}@${DB_HOST:-postgres}:${DB_PORT:-5432}/${DB_NAME:-bot-platform}}
      API_PORT: ${API_PORT}
      API_HOST: ${API_HOST}
      WEBHOOK_BASE_URL: ${WEBHOOK_BASE_URL}
      LOG_LEVEL: ${LOG_LEVEL}
      TELEGRAM_API_BASE: ${TELEGRAM_API_BASE}
      RUNTIME_VERSION: ${RUNTIME_VERSION}
      BOT_API_FILES_VOLUME: ${BOT_API_FILES_VOLUME:-bot-platform_bot_api_files}
    depends_on:
      - postgres
    ports:
      - "${API_PORT:-3000}:3000"
    networks:
      - botnet
    volumes:
      - ./storage:/app/storage
      - /var/run/docker.sock:/var/run/docker.sock

  postgres:
    image: postgres:15-alpine
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - botnet

  caddy:
    image: caddy:2-alpine
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
    depends_on:
      - bot-manager
    networks:
      - botnet

  bot-api:
    image: docker.io/aiogram/telegram-bot-api:latest
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "true"
      TELEGRAM_VERBOSITY: 2
    ports:
      - "8081:8081"
    volumes:
      - bot_api_files:/var/lib/telegram-bot-api
    networks:
      - botnet

networks:
  botnet:

volumes:
  pgdata:
  bot_api_files:
