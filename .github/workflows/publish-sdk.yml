name: Publish SDK

on:
  push:
    branches:
      - main
    paths:
      - 'packages/bot-sdk/**'
      - '.github/workflows/publish-sdk.yml'

jobs:
  publish:
    name: Build & publish @nikovonlas/bot-sdk
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # required for npm Trusted Publisher (OIDC)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install --workspaces

      - name: Build SDK
        run: npm --workspace @nikovonlas/bot-sdk run build

      - name: Check if version already published
        id: version_check
        run: |
          PKG_VERSION=$(node -p "require('./packages/bot-sdk/package.json').version")
          echo "version=$PKG_VERSION" >> $GITHUB_OUTPUT
          NPM_VERSION=$(npm view @nikovonlas/bot-sdk version 2>/dev/null || echo "none")
          echo "npm_version=$NPM_VERSION" >> $GITHUB_OUTPUT
          if [ "$PKG_VERSION" = "$NPM_VERSION" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Version $PKG_VERSION already published, skipping"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "Publishing $PKG_VERSION (npm has $NPM_VERSION)"
          fi

      - name: Publish to npm
        if: steps.version_check.outputs.skip == 'false'
        run: npm publish --workspace @nikovonlas/bot-sdk --access public --provenance
